name: Release desktop installers

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Rebuild native module for Node.js
        run: npm run rebuild:node

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

  package:
    name: Package ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            command: npm run dist:win -- --x64
            files: |
              release/Hermes-Agent-Platform-*.exe
              release/latest*.yml
              release/*.blockmap
          - os: ubuntu-latest
            artifact: ubuntu-x64
            command: npm run dist:linux -- --x64
            files: |
              release/*.deb
              release/latest*.yml
              release/*.blockmap
          - os: macos-15
            artifact: macos-arm64
            command: npm run dist:mac -- --arm64
            files: |
              release/*.dmg
              release/*.zip
              release/latest*.yml
              release/*.blockmap
          - os: macos-15-intel
            artifact: macos-x64
            command: npm run dist:mac -- --x64
            files: |
              release/*.dmg
              release/*.zip
              release/latest*.yml
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean release directory
        shell: bash
        run: rm -rf release

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Preserve architecture-specific macOS metadata
        if: startsWith(matrix.artifact, 'macos-')
        shell: bash
        run: mv release/latest-mac.yml "release/latest-mac-${{ matrix.artifact }}.yml"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge macOS update metadata
        run: node scripts/merge-mac-update-metadata.mjs artifacts

      - name: Reject legacy artifact names
        shell: bash
        run: |
          if find artifacts -type f | grep -E '(ChatGPTConnect|CodexConnect)'; then
            echo 'Legacy product name found in release artifacts.' >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Hermes Agent Platform ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
