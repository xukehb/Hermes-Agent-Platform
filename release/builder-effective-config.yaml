directories:
  output: release
  buildResources: build
appId: com.hermes.agent.platform
productName: CodexConnect
copyright: Copyright © 2026 CodexConnect Team
files:
  - filter:
      - dist/**/*
      - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**/*'
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: build/icon.icns
linux:
  icon: build/icon.png
electronVersion: 37.10.3
